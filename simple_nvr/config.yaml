name: simple_nvr
description: simple NVR — видеорегистратор с поддержкой камер, архива и режима киоска
url: https://github.com/augin/simple_nvr
image: augin/simple_nvr
arch: [ amd64, aarch64, i386, armv7 ]

# https://developers.home-assistant.io/docs/add-ons/configuration
version: 2.10.2
slug: simple_nvr
init: false
startup: system
host_network: true
homeassistant_api: true
video: true
audio: true
ingress: true
ingress_port: 8181
panel_icon: mdi:cctv
panel_title: Simple NVR
panel_admin: false
map: 
  - config:rw
  - media
  - ssl
  - share:rw

options:
  kiosk_enabled:
    name: Режим киоска
    description: Включить режим киоска (порт 8181 без авторизации, только камеры и архив)
    default: "true"
    type: bool
  kiosk_port:
    name: Порт киоска
    description: Порт для киоск-сервера
    default: "8181"
    type: integer

